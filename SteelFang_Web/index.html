<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SteelFang</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0630;
        /* mirrors the scene's own vertical falloff: lit purple up top, near-black below */
        background: radial-gradient(ellipse 120% 90% at 50% 38%,
                    #2e1e68 0%, #1a0f4d 45%, #0c0635 75%, #050426 100%);
      }
      /* Unity's style.css sets #unity-container.unity-desktop (id+class), which
         outranks a plain #unity-container - match that specificity or the
         absolute/translate positioning survives and the flex box is wrong. */
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        transform: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Lock the 1.6 display aspect (the canvas renders at 1920x1200).
         flex-shrink was scaling width and height by different amounts,
         drifting the ratio to ~1.53; the camera then showed more vertical
         area than the background sprite covers and its clear colour
         appeared as bands at the top and bottom. */
      #unity-canvas {
        display: block;
        flex: 0 0 auto;
        aspect-ratio: 960 / 600;
        width: min(100vw, calc(100vh * 1.6));
        height: auto;
        max-width: 100vw;
        max-height: 100vh;
        background: transparent;
        outline: none;
      }
      /* The loader swaps the container's class to unity-mobile on phones, which
         switches on Unity's `.unity-mobile #unity-canvas { width:100%; height:100% }`.
         That is a class plus an id, so it outranked the plain #unity-canvas rule
         above and stretched the 960x600 UI over the whole viewport - in portrait
         the menu ran off the left edge and START/SETTINGS/QUIT were unreachable.
         Match its specificity and keep the letterbox on every screen. */
      .unity-mobile #unity-canvas,
      #unity-container.unity-mobile #unity-canvas {
        aspect-ratio: 960 / 600;
        width: min(100vw, calc(100vh * 1.6));
        height: auto;
        max-width: 100vw;
        max-height: 100vh;
      }
      #unity-footer { display: none !important; }
      #unity-loading-bar {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #unity-warning {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        background: transparent;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1200 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // The build decides whether to show its on-screen control pad by reading
      // touch=1 / touch=0 off the page URL, so put it there when the user agent
      // says phone and the URL does not already settle it. Application.absoluteURL
      // is the one channel into the player that is reliable at any point: config
      // arguments never reach Environment.GetCommandLineArgs in WebGL, and Unity's
      // own device sniffing is what we are backstopping here.
      // A user-agent test alone misses real touch devices: iPadOS 13+ reports the
      // desktop Safari string, so an iPad never got the pad and was left with no way
      // to move at all. Pair it with a pointer query - a coarse pointer plus touch
      // points is what a phone or tablet has and a mouse-driven desktop does not,
      // so a touchscreen laptop still keeps its keyboard.
      var isTouchDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || ((navigator.maxTouchPoints || 0) > 0
            && window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

      if (!/[?&]touch=[01]/.test(location.search) && isTouchDevice) {
        var touchUrl = location.pathname
          + (location.search ? location.search + '&' : '?') + 'touch=1'
          + location.hash;
        history.replaceState(null, '', touchUrl);
      }

      var buildUrl = "Build";
      // vercel.json serves everything under /Build with
      // "max-age=31536000, immutable", but the four filenames never change between
      // builds. A returning player therefore kept last deploy's wasm out of cache for
      // a year and paired it with a freshly fetched data file, which kills the player
      // on "memory access out of bounds" before the game starts. Stamping the build's
      // own content hash onto every URL gives each build its own cache entries, so the
      // four files can never be mixed across versions. Regenerated on each deploy.
      var buildVersion = "b4f2edc24cc0";
      var v = "?v=" + buildVersion;
      var loaderUrl = buildUrl + "/SteelFang_Web.loader.js" + v;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/SteelFang_Web.data.br" + v,
        frameworkUrl: buildUrl + "/SteelFang_Web.framework.js.br" + v,
        codeUrl: buildUrl + "/SteelFang_Web.wasm.br" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "2DGA",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // The gameplay Canvas uses Constant Pixel Size, so its HUD (timer, gem
        // counter, tutorial popups, pause/game-over buttons) is laid out in raw
        // framebuffer pixels. Unity normally resizes that framebuffer to the CSS
        // box x devicePixelRatio, so the HUD kept one absolute size while the
        // view shrank: ~2900px wide on a desktop it looked tiny, ~900px wide on
        // a phone it swelled until the timer, "10 gems remaining" and the
        // tutorial text overlapped. Pinning the framebuffer to the canvas'
        // 1920x1200 attributes makes Screen.width/height constant, so the HUD is
        // laid out identically everywhere and the CSS letterbox scales it down
        // with the rest of the game.
        matchWebGLToCanvasSize: false,
      };

      if (isTouchDevice) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }
      // Desktop sizing is handled entirely in CSS so the canvas tracks the viewport.

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.unityInstance = unityInstance;
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
